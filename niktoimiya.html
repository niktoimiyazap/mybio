<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Это niktoimiya</title>
  <meta name="description" content="Это niktoimiya — все полезные ссылки уже есть здесь." />
  <meta name="author" content="Владислав (@niktoimiya)" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="canonical" href="https://niktoimiyazap.github.io/mybio/niktoimiya.html" />

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ru_RU" />
  <meta property="og:site_name" content="@niktoimiya" />
  <meta property="og:title" content="Это niktoimiya" />
  <meta property="og:description" content="Все полезные ссылки уже есть здесь." />
  <meta property="og:url" content="https://niktoimiyazap.github.io/mybio/niktoimiya.html" />

  <link rel="stylesheet" href="styles/niktoimiya.css?v=18" />
</head>
<body class="is-intro">
  <main class="page" id="page">
    <div class="logo-slot" id="logoSlot">
      <button
        class="mark-rig"
        id="markRig"
        type="button"
        aria-label="Логотип niktoimiya"
        title="\:"
      >
        <span class="mark-frame" id="markFrame" aria-hidden="true">
          <span class="mark-bracket mark-bracket--tl"></span>
          <span class="mark-bracket mark-bracket--br"></span>
        </span>
        <svg
          class="brand-mark"
          id="brandMark"
          viewBox="0 0 64 72"
          fill="none"
          aria-hidden="true"
        >
          <line
            class="mark-slash-guide"
            x1="14"
            y1="10"
            x2="33"
            y2="62"
            stroke="currentColor"
            stroke-width="1"
            stroke-linecap="butt"
          />
          <line
            class="mark-slash"
            id="markSlash"
            x1="14"
            y1="10"
            x2="33"
            y2="62"
            stroke="currentColor"
            stroke-width="6.2"
            stroke-linecap="butt"
          />
          <g class="mark-dots" id="markDots">
            <circle class="mark-dot mark-dot--top" cx="46" cy="29" r="4.3" fill="currentColor" />
            <circle class="mark-dot mark-dot--bottom" cx="46" cy="47" r="4.3" fill="currentColor" />
          </g>
        </svg>
      </button>
    </div>

    <header class="hero-copy">
      <div class="line-mask">
        <h1>Это niktoimiya</h1>
      </div>
      <div class="line-mask line-mask--sub">
        <p>Все полезные ссылки уже есть здесь</p>
      </div>
    </header>

    <a
      class="tg-card"
      id="tgCard"
      href="https://t.me/nktpub"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Все материалы из видео тут — @nktpub в Telegram"
    >
      <span class="tg-card__icon" aria-hidden="true">
        <img src="assets/icon-tg-3d.png" alt="" width="64" height="64" decoding="async" />
      </span>
      <span class="tg-card__copy">
        <span class="tg-card__title">Все материалы из видео тут</span>
        <span class="tg-card__sub">@nktpub</span>
      </span>
      <span class="tg-card__arrow" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 14 14 6" />
          <path d="M7.5 6H14v6.5" />
        </svg>
      </span>
    </a>

    <section class="tile-grid" aria-label="Полезные ссылки">
      <a
        class="tile tile--tt"
        href="https://www.tiktok.com/@niktoimiya"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="TikTok"
        style="--i: 0;"
      >
        <span class="tile__icon" aria-hidden="true">
          <img src="assets/icon-tiktok-3d.png" alt="" width="64" height="64" decoding="async" />
        </span>
        <span class="tile__label">TikTok</span>
      </a>

      <a
        class="tile tile--yt"
        href="https://www.youtube.com/@niktoimiya"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
        style="--i: 1;"
      >
        <span class="tile__icon" aria-hidden="true">
          <img src="assets/icon-youtube-3d.png" alt="" width="64" height="64" decoding="async" />
        </span>
        <span class="tile__label">YouTube</span>
      </a>

      <button
        class="tile tile--locked"
        id="lockedTile"
        type="button"
        aria-disabled="true"
        aria-label="Заблокировано"
        style="--i: 2;"
      >
        <span class="tile__icon tile__icon--lock" aria-hidden="true">
          <img src="assets/icon-lock-3d.png" alt="" width="64" height="64" decoding="async" />
        </span>
        <span class="tile__label">Скоро</span>
      </button>
    </section>
  </main>

  <script src="scripts/niktoimiya.js?v=18"></script>
</body>
</html>
