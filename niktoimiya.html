<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Это niktoimiya</title>
  <meta name="description" content="Это niktoimiya — все полезные ссылки уже есть здесь." />
  <meta name="author" content="Владислав (@niktoimiya)" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="canonical" href="https://niktoimiyazap.github.io/mybio/niktoimiya.html" />

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ru_RU" />
  <meta property="og:site_name" content="@niktoimiya" />
  <meta property="og:title" content="Это niktoimiya" />
  <meta property="og:description" content="Все полезные ссылки уже есть здесь." />
  <meta property="og:url" content="https://niktoimiyazap.github.io/mybio/niktoimiya.html" />

  <link rel="stylesheet" href="styles/niktoimiya.css" />
</head>
<body class="is-intro">
  <main class="page" id="page">
    <div class="logo-slot" id="logoSlot">
      <button
        class="mark-rig"
        id="markRig"
        type="button"
        aria-label="Логотип niktoimiya"
        title="\:"
      >
        <span class="mark-frame" id="markFrame" aria-hidden="true">
          <span class="mark-bracket mark-bracket--tl"></span>
          <span class="mark-bracket mark-bracket--br"></span>
        </span>
        <svg
          class="brand-mark"
          id="brandMark"
          viewBox="0 0 64 72"
          fill="none"
          aria-hidden="true"
        >
          <line
            class="mark-slash-guide"
            x1="14"
            y1="10"
            x2="33"
            y2="62"
            stroke="currentColor"
            stroke-width="1"
            stroke-linecap="butt"
          />
          <line
            class="mark-slash"
            id="markSlash"
            x1="14"
            y1="10"
            x2="33"
            y2="62"
            stroke="currentColor"
            stroke-width="6.2"
            stroke-linecap="butt"
          />
          <g class="mark-dots" id="markDots">
            <circle class="mark-dot mark-dot--top" cx="46" cy="29" r="4.3" fill="currentColor" />
            <circle class="mark-dot mark-dot--bottom" cx="46" cy="47" r="4.3" fill="currentColor" />
          </g>
        </svg>
      </button>
    </div>

    <header class="hero-copy">
      <div class="line-mask">
        <h1>Это niktoimiya</h1>
      </div>
      <div class="line-mask line-mask--sub">
        <p>Все полезные ссылки уже есть здесь</p>
      </div>
    </header>

    <section class="tile-grid" aria-label="Полезные ссылки">
      <a
        class="tile tile--tg"
        href="https://t.me/niktoimiya"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Telegram"
        style="--i: 0;"
      >
        <span class="tile__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M21.426 3.574a1.45 1.45 0 0 0-1.545-.252L2.883 10.427a1.28 1.28 0 0 0 .088 2.387l4.38 1.482 1.693 5.297a1.1 1.1 0 0 0 1.816.453l2.536-2.465 4.422 3.247a1.45 1.45 0 0 0 2.275-.87l2.98-14.43a1.45 1.45 0 0 0-.647-1.954Zm-3.68 4.44-7.434 6.662a.72.72 0 0 0-.23.437l-.316 2.37-1.15-3.6a.72.72 0 0 1 .31-.83l8.63-5.344c.24-.148.466.153.19.305Z"/>
          </svg>
        </span>
        <span class="tile__label">Telegram</span>
      </a>

      <a
        class="tile tile--tt"
        href="https://www.tiktok.com/@niktoimiya"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="TikTok"
        style="--i: 1;"
      >
        <span class="tile__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 0 1-2.59 2.5c-1.42 0-2.6-1.16-2.6-2.6 0-1.72 1.66-3.01 3.37-2.48V9.66c-3.45-.46-6.47 2.22-6.47 5.64 0 3.33 2.76 5.7 5.69 5.7 3.14 0 5.69-2.55 5.69-5.7V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3s-1.88.09-3.24-1.48Z"/>
          </svg>
        </span>
        <span class="tile__label">TikTok</span>
      </a>

      <a
        class="tile tile--yt"
        href="https://www.youtube.com/@niktoimiya"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
        style="--i: 2;"
      >
        <span class="tile__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M21.582 6.186a2.506 2.506 0 0 0-1.768-1.768C18.254 4 12 4 12 4s-6.254 0-7.814.418c-.86.23-1.538.908-1.768 1.768C2 7.746 2 12 2 12s0 4.254.418 5.814c.23.86.908 1.538 1.768 1.768C5.746 20 12 20 12 20s6.254 0 7.814-.418a2.505 2.505 0 0 0 1.768-1.768C22 16.254 22 12 22 12s0-4.254-.418-5.814ZM10 15.464V8.536L16 12l-6 3.464Z"/>
          </svg>
        </span>
        <span class="tile__label">YouTube</span>
      </a>

      <button
        class="tile tile--locked"
        id="lockedTile"
        type="button"
        aria-disabled="true"
        aria-label="Заблокировано"
        style="--i: 3;"
      >
        <span class="tile__icon tile__icon--lock" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4.5" y="10.5" width="15" height="10" rx="3.2" fill="currentColor" fill-opacity="0.12" />
            <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" />
            <circle cx="12" cy="15.2" r="1.2" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <span class="tile__label">Скоро</span>
      </button>
    </section>
  </main>

  <script src="scripts/niktoimiya.js"></script>
</body>
</html>
