<body class="is-intro">
  <main class="page" id="page">
    <div class="logo-slot" id="logoSlot">
      <button
        class="mark-rig"
        id="markRig"
        type="button"
        aria-label="Логотип niktoimiya"
        title="\:"
      >
        <span class="mark-frame" id="markFrame" aria-hidden="true">
          <span class="mark-bracket mark-bracket--tl"></span>
          <span class="mark-bracket mark-bracket--br"></span>
        </span>
        <svg
          class="brand-mark"
          id="brandMark"
          viewBox="0 0 64 72"
          fill="none"
          aria-hidden="true"
        >
          <line
            class="mark-slash-guide"
            x1="14"
            y1="10"
            x2="33"
            y2="62"
            stroke="currentColor"
            stroke-width="1"
            stroke-linecap="butt"
          />
          <line
            class="mark-slash"
            id="markSlash"
            x1="14"
            y1="10"
            x2="33"
            y2="62"
            stroke="currentColor"
            stroke-width="6.2"
            stroke-linecap="butt"
          />
          <g class="mark-dots" id="markDots">
            <circle class="mark-dot mark-dot--top" cx="46" cy="29" r="4.3" fill="currentColor" />
            <circle class="mark-dot mark-dot--bottom" cx="46" cy="47" r="4.3" fill="currentColor" />
          </g>
        </svg>
      </button>
    </div>

    <header class="hero-copy">
      <div class="line-mask">
        <h1>Это niktoimiya</h1>

      <div class="line-mask line-mask--sub">
        <p>Все полезные ссылки уже есть здесь</p>

    <a
      class="tg-capsule"
      id="tgCapsule"
      href="https://t.me/nktpub"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Все материалы из видео тут — @nktpub в Telegram"
    >
      <canvas class="tg-capsule__particles" id="tgParticles" aria-hidden="true"></canvas>
      <span class="tg-capsule__badge" aria-hidden="true">
        <svg viewBox="0 0 240 240" fill="none">
          <path d="M54.3 118.8c35-15.2 58.3-25.3 70-30.2 33.3-13.9 40.3-16.3 44.8-16.4 1 0 3.2.2 4.7 1.4 1.2 1 1.5 2.3 1.7 3.3.2 1 .4 3.1.2 4.7-1.8 19-9.6 65.1-13.6 86.3-1.7 9-5 12-8.2 12.3-7 .6-12.3-4.6-19-9-10.6-6.9-16.5-11.2-26.8-18-11.9-7.8-4.2-12.1 2.6-19.1 1.8-1.8 32.5-29.8 33.1-32.3.1-.3.1-1.5-.6-2.1-.7-.6-1.7-.4-2.5-.2-1.1.2-17.9 11.4-50.6 33.5-4.8 3.3-9.1 4.9-13 4.8-4.3-.1-12.5-2.4-18.7-4.4-7.5-2.4-13.5-3.7-13-7.9.3-2.2 3.3-4.4 9-6.7Z" fill="#FFFFFF" />
        </svg>
      </span>
      <span class="tg-capsule__text">
        <span class="tg-capsule__title">Все материалы из видео тут</span>
        <span class="tg-capsule__handle">@nktpub</span>
      </span>
      <span class="tg-capsule__arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17 17 7" />
          <path d="M9 7h8v8" />
        </svg>
      </span>
    </a>

    <section class="tile-grid" aria-label="Полезные ссылки">
      <a
        class="tile tile--tt"
        href="https://www.tiktok.com/@niktoimiya"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="TikTok"
        style="--i: 0;"
      >
        <span class="tile__icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="ttGrad" x1="32" y1="3" x2="32" y2="61" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#222226" />
                <stop offset="100%" stop-color="#0A0A0C" />
              </linearGradient>
            </defs>
            <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#ttGrad)" />
            <rect x="3.5" y="3.5" width="57" height="57" rx="15.5" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
            <g transform="translate(13.5 13.5) scale(1.54)">
              <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1Z" fill="#25F4EE" transform="translate(-0.75 -0.6)" />
              <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1Z" fill="#FE2C55" transform="translate(0.75 0.6)" />
              <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1Z" fill="#FFFFFF" />
            </g>
          </svg>
        </span>
        <span class="tile__label">TikTok</span>
      </a>

      <a
        class="tile tile--yt"
        href="https://www.youtube.com/@niktoimiya"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
        style="--i: 1;"
      >
        <span class="tile__icon" aria-hidden="true">
          <svg viewBox="-3 -13 74 74" fill="none">
            <defs>
              <linearGradient id="ytGrad" x1="34" y1="0" x2="34" y2="48" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FF1E1E" />
                <stop offset="100%" stop-color="#E00012" />
              </linearGradient>
            </defs>
            <path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55C3.97 2.33 2.27 4.81 1.48 7.74.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26Z" fill="url(#ytGrad)" />
            <path d="M27.2 33.8V14.2L44.8 24 27.2 33.8Z" fill="#FFFFFF" />
          </svg>
        </span>
        <span class="tile__label">YouTube</span>
      </a>

      <button
        class="tile tile--locked"
        id="lockedTile"
        type="button"
        aria-disabled="true"
        aria-label="Заблокировано"
        style="--i: 2;"
      >
        <span class="tile__icon tile__icon--lock" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="lockGrad" x1="32" y1="26" x2="32" y2="56" gradientUnits="userSpaceOnUse">

            <rect x="14" y="26.5" width="36" height="28.5" rx="10" fill="url(#lockGrad)" />
            <rect x="14.5" y="27" width="35" height="27.5" rx="9.5" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1" />
            <circle cx="32" cy="39" r="3.2" fill="#5E5E64" />
            <rect x="30.5" y="40.5" width="3" height="6.2" rx="1.5" fill="#5E5E64" />
          </svg>
        </span>
        <span class="tile__label">Скоро</span>
      </button>
    </section>
  </main>

  <script src="scripts/niktoimiya.js?v=8"></script>
