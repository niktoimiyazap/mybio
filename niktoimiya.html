<!doctype html>

<head>

<body class="is-intro">
  <main class="page" id="page">
    <div class="logo-slot" id="logoSlot">
      <button
        class="mark-rig"
        id="markRig"
        type="button"
        aria-label="Логотип niktoimiya"
        title="\:"
      >
        <span class="mark-frame" id="markFrame" aria-hidden="true">
          <span class="mark-bracket mark-bracket--tl"></span>
          <span class="mark-bracket mark-bracket--br"></span>
        </span>
        <svg
          class="brand-mark"
          id="brandMark"
          viewBox="0 0 64 72"
          fill="none"
          aria-hidden="true"
        >
          <line
            class="mark-slash-guide"
            x1="14"
            y1="10"
            x2="33"
            y2="62"
            stroke="currentColor"
            stroke-width="1"
            stroke-linecap="butt"
          />
          <line
            class="mark-slash"
            id="markSlash"
            x1="14"
            y1="10"
            x2="33"
            y2="62"
            stroke="currentColor"
            stroke-width="6.2"
            stroke-linecap="butt"
          />
          <g class="mark-dots" id="markDots">
            <circle class="mark-dot mark-dot--top" cx="46" cy="29" r="4.3" fill="currentColor" />
            <circle class="mark-dot mark-dot--bottom" cx="46" cy="47" r="4.3" fill="currentColor" />
          </g>
        </svg>
      </button>
    </div>

    <header class="hero-copy">
      <div class="line-mask">
        <h1>Это niktoimiya</h1>
      </div>
      <div class="line-mask line-mask--sub">
        <p>Все полезные ссылки уже есть здесь</p>
      </div>
    </header>

    <section class="tile-grid" aria-label="Полезные ссылки">
      <a
        class="tile tile--tg"
        href="https://t.me/niktoimiya"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Telegram"
        style="--i: 0;"
      >
        <span class="tile__icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="tgBg" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#40B9F4" />
                <stop offset="100%" stop-color="#1E88E5" />
              </linearGradient>
              <linearGradient id="tgGloss" x1="32" y1="4" x2="32" y2="30" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34" />
                <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
              </linearGradient>
            </defs>
            <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#tgBg)" />
            <rect x="4" y="4" width="56" height="28" rx="18" fill="url(#tgGloss)" />
            <path d="M46.6 18.8c.5-2.1-.9-3-2.7-2.3L15.1 27.6c-2 .8-1.9 2.1-.3 2.6l7.3 2.3 17-10.7c.8-.5 1.5-.2.9.3L26.2 34.6l-.5 7.7c.8 0 1.2-.4 1.6-.8l3.9-3.8 8.1 6c1.5.8 2.6.4 3-1.4l4.3-23.5Z" fill="#FFFFFF" />
            <path d="M26.2 34.6 25.7 42.3c.8 0 1.2-.4 1.6-.8l3.9-3.8-5-3.1Z" fill="#B8E1FA" />
            <path d="M22.1 32.5 25.7 42.3l.5-7.7 13.8-12.5c.6-.5-.1-.8-.9-.3L22.1 32.5Z" fill="#DCEFFD" />
          </svg>
        </span>
        <span class="tile__label">Telegram</span>
      </a>

      <a
        class="tile tile--tt"
        href="https://www.tiktok.com/@niktoimiya"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="TikTok"
        style="--i: 1;"
      >
        <span class="tile__icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="ttBg" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#27272B" />
                <stop offset="100%" stop-color="#0C0C0E" />
              </linearGradient>
              <linearGradient id="ttGloss" x1="32" y1="4" x2="32" y2="30" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
                <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
              </linearGradient>
            </defs>
            <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#ttBg)" />
            <rect x="4" y="4" width="56" height="28" rx="18" fill="url(#ttGloss)" />
            <path d="M40.3 21.8a8.9 8.9 0 0 1-2.5-6.1h-5.8v23.4a4.9 4.9 0 1 1-3.5-4.7v-6a10.8 10.8 0 1 0 9.3 10.7V27.6a14.4 14.4 0 0 0 8.2 2.6v-5.8a8.9 8.9 0 0 1-5.7-2.6Z" fill="#25F4EE" transform="translate(-1.8 -1.4)" />
            <path d="M40.3 21.8a8.9 8.9 0 0 1-2.5-6.1h-5.8v23.4a4.9 4.9 0 1 1-3.5-4.7v-6a10.8 10.8 0 1 0 9.3 10.7V27.6a14.4 14.4 0 0 0 8.2 2.6v-5.8a8.9 8.9 0 0 1-5.7-2.6Z" fill="#FE2C55" transform="translate(1.8 1.4)" />
            <path d="M40.3 21.8a8.9 8.9 0 0 1-2.5-6.1h-5.8v23.4a4.9 4.9 0 1 1-3.5-4.7v-6a10.8 10.8 0 1 0 9.3 10.7V27.6a14.4 14.4 0 0 0 8.2 2.6v-5.8a8.9 8.9 0 0 1-5.7-2.6Z" fill="#FFFFFF" />
          </svg>
        </span>
        <span class="tile__label">TikTok</span>
      </a>

      <a
        class="tile tile--yt"
        href="https://www.youtube.com/@niktoimiya"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
        style="--i: 2;"
      >
        <span class="tile__icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="ytBg" x1="32" y1="10" x2="32" y2="54" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FF3B30" />
                <stop offset="100%" stop-color="#D70015" />
              </linearGradient>
              <linearGradient id="ytGloss" x1="32" y1="10" x2="32" y2="33" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
                <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
              </linearGradient>
            </defs>
            <rect x="4" y="10" width="56" height="44" rx="16" fill="url(#ytBg)" />
            <rect x="4" y="10" width="56" height="22" rx="16" fill="url(#ytGloss)" />
            <path d="M27.2 23.8c0-1.6 1.7-2.6 3.1-1.8l13.4 8.2c1.3.8 1.3 2.8 0 3.6l-13.4 8.2c-1.4.8-3.1-.2-3.1-1.8V23.8Z" fill="#FFFFFF" />
          </svg>
        </span>
        <span class="tile__label">YouTube</span>
      </a>

      <button
        class="tile tile--locked"
        id="lockedTile"
        type="button"
        aria-disabled="true"
        aria-label="Заблокировано"
        style="--i: 3;"
      >
        <span class="tile__icon tile__icon--lock" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="lockBody" x1="32" y1="26" x2="32" y2="56" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#D1D1D6" />
                <stop offset="100%" stop-color="#98989D" />
              </linearGradient>
              <linearGradient id="lockGloss" x1="32" y1="26" x2="32" y2="41" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
                <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
              </linearGradient>
            </defs>
            <path d="M22 27v-6.5C22 14.7 26.5 10 32 10s10 4.7 10 10.5V27" stroke="#A1A1A6" stroke-width="6.5" stroke-linecap="round" />
            <rect x="13" y="26" width="38" height="30" rx="11" fill="url(#lockBody)" />
            <rect x="13" y="26" width="38" height="15" rx="11" fill="url(#lockGloss)" />
            <circle cx="32" cy="39.5" r="3.6" fill="#545458" />
            <rect x="30.2" y="41" width="3.6" height="6.8" rx="1.8" fill="#545458" />
          </svg>
        </span>
        <span class="tile__label">Скоро</span>
      </button>
    </section>
  </main>

  <script src="scripts/niktoimiya.js?v=5"></script>
</body>
</html>
